<!DOCTYPE html>
<html>
<head>
    <title>Personality Spark</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    color: white;

    background: linear-gradient(
        120deg, #141e30, #42275a, #004e92
    );

    background-size: 300% 300%;
    animation: bg 8s infinite alternate;
}

@keyframes bg {
    from {
        background-position: 0% 50%;
    }

    to {
        background-position: 100% 50%;
    }
}

.box {
    margin: 70px auto;
    padding: 30px;
    width: 80%;
    max-width: 500px;

    background: #ffffff20;
    border-radius: 25px;
    box-shadow: 0 0 25px cyan;
}

h1 {
    color: cyan;
    font-size: 35px;
    text-shadow: 0 0 15px cyan;
}

select {
    padding: 13px;
    width: 80%;
    border-radius: 12px;
    font-size: 16px;
}

button {
    padding: 13px 22px;
    margin: 15px;
    border: 0;
    border-radius: 25px;
    background: cyan;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.1);
}

#result {
    display: none;
}

#message {
    font-size: 24px;
    color: yellow;
    margin: 30px 5px;
    line-height: 1.5;
}

.tag {
    color: cyan;
    font-size: 18px;
}

</style>
</head>

<body>

<!-- HOME PAGE -->

<div class="box" id="home">

    <h1>✨ PERSONALITY SPARK</h1>

    <h2>Discover Your Superpower 🚀</h2>

    <p>Select Your Name</p>

    <select id="student">

        <option value="">Choose Your Name</option>

        <option value="Anjali">Anjali</option>
        <option value="Sneha">Sneha</option>
        <option value="Priya">Priya</option>
        <option value="Divya">Divya</option>
        <option value="Kavya">Kavya</option>
        <option value="Abhi">Abhi</option>
        <option value="Rahul">Rahul</option>
        <option value="Kiran">Kiran</option>

    </select>

    <br>

    <button onclick="discover()">
        DISCOVER ✨
    </button>

</div>


<!-- RESULT PAGE -->

<div class="box" id="result">

    <h1>🌟 YOUR SPARK</h1>

    <h2 id="studentName"></h2>

    <div class="tag" id="type"></div>

    <div id="message"></div>

    <button onclick="discover()">
        ANOTHER MESSAGE 🎲
    </button>

    <br>

    <button onclick="back()">
        ⬅ BACK
    </button>

</div>


<!-- JAVASCRIPT -->

<script>

let messages = {

    Anjali: [
        ["POSITIVE 💖", "Your kindness makes everyone feel special!"],
        ["FUNNY 😂", "Your smile has more power than Wi-Fi!"],
        ["MOTIVATION 🚀", "Never hide your talent. The world needs it!"]
    ],

    Sneha: [
        ["POSITIVE 🌸", "Your creativity makes ordinary things special!"],
        ["FUNNY 😎", "Your ideas run faster than Google!"],
        ["MOTIVATION 🔥", "Keep learning. Your future is unlimited!"]
    ],

    Priya: [
        ["POSITIVE 💎", "Your confidence is your greatest strength!"],
        ["FUNNY 😂", "Your energy needs its own battery!"],
        ["MOTIVATION 🌟", "Believe in yourself and keep moving forward!"]
    ],

    Divya: [
        ["POSITIVE ✨", "Your uniqueness is your superpower!"],
        ["FUNNY 😁", "Your brain has too many creative tabs open!"],
        ["MOTIVATION 🚀", "Small steps today create big success tomorrow!"]
    ],

    Kavya: [
        ["POSITIVE 💖", "Your imagination can create amazing things!"],
        ["FUNNY 😂", "Your dreams need their own spaceship!"],
        ["MOTIVATION 🔥", "Stay focused. Your time to shine will come!"]
    ],

    Abhi: [
        ["POSITIVE 🧠", "Your curiosity can take you beyond limits!"],
        ["FUNNY 😂", "Your brain is always running in future mode!"],
        ["MOTIVATION 🚀", "Think big. Build bigger. Never stop learning!"]
    ],

    Rahul: [
        ["POSITIVE 💪", "Your determination is your biggest strength!"],
        ["FUNNY 😎", "Your confidence enters the room before you!"],
        ["MOTIVATION 🔥", "Success belongs to those who keep trying!"]
    ],

    Kiran: [
        ["POSITIVE 🌟", "Your positive energy can inspire others!"],
        ["FUNNY 😂", "Your ideas never run out of fuel!"],
        ["MOTIVATION 🚀", "Keep growing. Your best chapter is ahead!"]
    ]

};


// DISCOVER FUNCTION

function discover() {

    let name = document.getElementById("student").value;

    if (name === "") {
        alert("Please Select a Name!");
        return;
    }

    let list = messages[name];

    let random = Math.floor(Math.random() * list.length);

    document.getElementById("home").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("studentName").innerHTML = name;

    document.getElementById("type").innerHTML = list[random][0];

    document.getElementById("message").innerHTML = list[random][1];

}


// BACK FUNCTION

function back() {

    document.getElementById("result").style.display = "none";

    document.getElementById("home").style.display = "block";

}

</script>

</body>
</html>
